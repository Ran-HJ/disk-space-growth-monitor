name: Bug 报告
description: 报告可复现的功能、界面、扫描或 CLI 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请使用 Security 页面中的私密报告入口，不要公开提交。
        请勿上传正式数据库、认证文件或未脱敏的日志与路径。

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 例如 v0.7.5、源码 v0.8.1 或提交哈希。
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 例如 Windows 11 24H2；可附显示缩放比例。
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - GitHub Release GUI
        - GitHub Release CLI
        - 源码 GUI
        - 源码 CLI
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用编号步骤说明最小复现过程；优先使用临时目录和隔离数据。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: dropdown
    id: isolated_data
    attributes:
      label: 是否使用隔离数据复现
      description: 不要为了复现问题修改或上传正式 monitor.db。
      options:
        - 是，使用临时目录或临时 SQLite
        - 是，使用正式数据的一致副本
        - 否，尚未能在隔离环境复现
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的诊断信息（可选）
      description: 只粘贴必要片段；不要提供数据库、日志全文、个人路径、管道地址或认证材料。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除密钥、认证文件、数据库、日志原文和未脱敏的个人路径。
          required: true
        - label: 这不是需要私密披露的安全漏洞。
          required: true
