name: 功能建议
description: 描述用户问题、期望结果和安全边界
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题，再说明期望结果。项目默认保持只读分析边界，
        不会因为建议涉及磁盘空间就自动增加删除、移动或清理能力。

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 当前工作流中哪里不够清楚、可靠或高效？
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 期望结果
      description: 描述用户可观察到的结果，不必预先指定实现方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案（可选）

  - type: textarea
    id: safety
    attributes:
      label: 数据与安全边界
      description: 是否涉及正式数据库、个人路径、文件内容，或移动/删除/修改用户文件？如涉及，请说明为什么只读方案不能满足需求。
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我没有在公开建议中包含密钥、数据库、日志原文或未脱敏的个人信息。
          required: true
        - label: 这不是需要私密披露的安全漏洞。
          required: true
